services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
  api:
    build:
      context: ./backend
    image: architecture-bionicpro-api:local
    profiles: [reports]
    environment:
      REPORTS_CLICKHOUSE_URL: http://clickhouse:8123
      REPORTS_CLICKHOUSE_USER: reports_reader
      REPORTS_CLICKHOUSE_PASSWORD: reports_reader_demo
      REPORTS_OIDC_ISSUER: http://localhost:8080/realms/reports-realm
      REPORTS_OIDC_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      REPORTS_OIDC_AUDIENCE: reports-api
      REPORTS_OIDC_CLIENT: reports-frontend
      REPORTS_FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  crm_db:
    image: postgres:14
    profiles: [reports]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: crm_owner_demo
    volumes:
      - crm_data:/var/lib/postgresql/data
      - ./data/crm/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
  telemetry_db:
    image: postgres:14
    profiles: [reports]
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_owner
      POSTGRES_PASSWORD: telemetry_owner_demo
    volumes:
      - telemetry_data:/var/lib/postgresql/data
      - ./data/telemetry/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U telemetry_owner -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    profiles: [reports]
    environment:
      CLICKHOUSE_USER: reports_admin
      CLICKHOUSE_PASSWORD: clickhouse_admin_demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  airflow_db:
    image: postgres:14
    profiles: [reports]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_demo
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow:
    build:
      context: ./airflow
    image: architecture-bionicpro-airflow:3.4.0
    profiles: [reports]
    command: [bash, /opt/airflow/start.sh]
    environment:
      AIRFLOW_CONFIG: /opt/airflow/state/airflow.cfg
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_demo@airflow_db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json.generated
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__API__BASE_URL: http://localhost:8081
      AIRFLOW__API__WORKERS: "1"
      BIONICPRO_CRM_DSN: host=crm_db dbname=crm user=crm_reader password=crm_reader_demo
      BIONICPRO_TELEMETRY_DSN: host=telemetry_db dbname=telemetry user=telemetry_reader password=telemetry_reader_demo
      BIONICPRO_CLICKHOUSE_URL: http://clickhouse:8123
      BIONICPRO_CLICKHOUSE_USER: etl_writer
      BIONICPRO_CLICKHOUSE_PASSWORD: etl_writer_demo
      BIONICPRO_ETL_WORK_DIR: /opt/airflow/work
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_state:/opt/airflow/state
      - airflow_work:/opt/airflow/work
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow_db:
        condition: service_healthy
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /opt/airflow/healthcheck.py]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  crm_data:
  telemetry_data:
  clickhouse_data:
  airflow_db_data:
  airflow_state:
  airflow_work:
  airflow_logs:
